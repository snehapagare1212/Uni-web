<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <link rel="stylesheet" href="Login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>

<body>

    <div class="login">
        <h2>Login</h2>

        <form id="loginForm">

            <div class="form-group">
                <input type="email" id="email" required>
                <i class="fa-solid fa-envelope"></i>
                <label>Email</label>
            </div>

            <div class="form-group">
                <input type="password" id="password" required>
                <i class="fa-solid fa-key"></i>
                <label>Password</label>
            </div>

            <p>
                <span>Remember Me</span>
                <input type="checkbox" id="rememberMe">
            </p>

            <button type="submit" class="btn">Login</button>

        </form>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const rememberMe = document.getElementById("rememberMe").checked;

            try {
                const response = await fetch("https://uni-web-22c9.onrender.com/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        rememberMe: rememberMe
                    })
                });

                const data = await response.json();

                if (data.success) {

                    if (rememberMe) {
                        // Remember Me ON → survives browser restart
                        localStorage.setItem("username", data.user.name);
                            sessionStorage.removeItem("username");
                    } else {
                        // Remember Me OFF → only survives until browser/tab session ends
                        sessionStorage.setItem("username", data.user.name);
                        localStorage.removeItem("username");
                    }

                    alert("✅ User has logged in successfully!");

                    window.location.href = "index.html";
                } else {
                    alert("❌ " + data.message);
                }

            } catch (error) {
                console.error(error);
                alert("❌ Unable to connect to the server.");
            }
        });




    </script>

</body>

</html>
